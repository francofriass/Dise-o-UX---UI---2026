<body data-pagina="errorDePago" data-paso="6" class="min-h-screen pb-44 lg:pb-16">

        <a href="#" class="text-[14px] font-medium text-slate-500 hover:text-slate-900" data-sin-destino>Ayuda</a>
        <button type="button" class="btn" data-variant="cuenta" data-sin-destino>Mi cuenta</button>

    </div>
  </header>
  <main class="mx-auto max-w-[480px] px-5 pt-16 text-center lg:mt-12 lg:max-w-[580px] lg:rounded-2xl lg:border lg:border-slate-200 lg:bg-white lg:p-10">

    <h1 class="t-h2">No pudimos procesar el pago</h1>
    <p class="t-lead mt-3 text-[13px]">La tarjeta fue rechazada. Revisá los datos o probá con otro medio de pago. Tus datos quedaron guardados.</p>

    <div class="alert alert-aviso mt-6 text-left" role="note">
      <section><p>Tarjeta de prueba que fuerza el error: 4000 0000 0000 0002</p></section>
    </div>

    <div class="acciones acciones--centrada acciones--resultado">
      <button type="button" class="btn btn-lg" data-accion="reintentar">Reintentar pago</button>
      <button type="button" class="btn btn-lg" data-variant="outline" data-accion="cambiar-medio">Cambiar medio de pago</button>
    </div>
  </main>
</body>
