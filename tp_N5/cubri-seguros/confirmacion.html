<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cubrí Seguros · Contratación confirmada</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F46E5'/%3E%3Cpath d='M16 7c2 1.6 4.4 2.4 6.6 2.4V16c0 4.4-3 7-6.6 8.4C12.4 23 9.4 20.400 9.400 16V9.400C11.600 9.400 14 8.600 16 7z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- Tipografía: Inter (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <!-- Basecoat UI (estilos de componentes) -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/basecoat-css@1.1.0/dist/basecoat.cdn.min.css">
  <!-- Tailwind v4 en el navegador (utilidades) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/componentes.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-pagina="confirmacion" data-paso="5" class="min-h-screen pb-44 lg:pb-16">
  <header class="hidden border-b border-slate-200 bg-white lg:block">
    <div class="mx-auto flex h-16 max-w-[1360px] items-center justify-between px-10">
      <a href="catalogo.html" class="inline-flex items-center gap-2" aria-label="Cubrí Seguros — inicio"><span class="inline-flex size-8 items-center justify-center rounded-lg bg-indigo-600 text-white"><svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg></span><span class="text-[17px] font-extrabold tracking-tight text-indigo-800">Cubrí</span></a>
      <nav class="hidden items-center gap-8 lg:flex" aria-label="Menú principal">
        <a href="#" class="text-[14px] font-medium text-slate-500 hover:text-slate-900" data-sin-destino>Seguros</a>
        <a href="#" class="text-[14px] font-medium text-slate-500 hover:text-slate-900" data-sin-destino>Siniestros</a>
        <a href="#" class="text-[14px] font-medium text-slate-500 hover:text-slate-900" data-sin-destino>Ayuda</a>
        <button type="button" class="btn" data-variant="cuenta" data-sin-destino>Mi cuenta</button>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-[480px] px-5 pt-16 text-center lg:mt-12 lg:max-w-[580px] lg:rounded-2xl lg:border lg:border-slate-200 lg:bg-white lg:p-10">
    <div class="mx-auto mb-6 flex size-24 items-center justify-center rounded-full bg-emerald-50 text-emerald-600 ring-8 ring-emerald-50/60 lg:size-[72px] lg:ring-0"><svg viewBox="0 0 24 24" class="size-10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1 class="t-h2">¡Listo, <span id="nombre-titular"></span>! <br class="lg:hidden">Tu celular ya está protegido</h1>
    <p class="t-lead mt-3 text-[13px]">Te enviamos la póliza a <span id="email-titular"></span></p>
    <p class="mt-5"><span id="numero-poliza" class="inline-block rounded-full bg-indigo-50 px-5 py-2 text-[15px] font-extrabold tracking-wide text-indigo-800"></span></p>

    <dl class="panel panel--desk-gris mt-6 grid gap-2 px-4 py-3 text-left text-[13px] lg:px-5 lg:py-4 lg:text-[12px]">
      <div class="flex justify-between"><dt class="text-muted">Plan</dt><dd id="detalle-plan" class="font-semibold"></dd></div>
      <div class="hidden justify-between lg:flex"><dt class="text-muted">Equipo</dt><dd id="detalle-equipo" class="font-semibold"></dd></div>
      <div class="flex justify-between"><dt class="text-muted">Vigencia desde</dt><dd id="detalle-vigencia" class="font-semibold"></dd></div>
      <div class="flex justify-between"><dt class="text-muted">Cuota mensual</dt><dd id="detalle-cuota" class="font-semibold"></dd></div>
    </dl>

    <div class="acciones acciones--centrada acciones--resultado">
      <button type="button" class="btn btn-lg" data-accion="descargar">Descargar póliza</button>
      <button type="button" class="btn btn-lg btn-desk-outline" data-variant="ghost" data-accion="inicio">Volver al inicio</button>
    </div>
  </main>
</body>
</html>
