<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cubrí Seguros · Tus datos</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F46E5'/%3E%3Cpath d='M16 7c2 1.6 4.4 2.4 6.6 2.4V16c0 4.4-3 7-6.6 8.4C12.4 23 9.4 20.400 9.400 16V9.400C11.600 9.400 14 8.600 16 7z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- Tipografía: Inter (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <!-- Basecoat UI (estilos de componentes) -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/basecoat-css@1.1.0/dist/basecoat.cdn.min.css">
  <!-- Tailwind v4 en el navegador (utilidades) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/componentes.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-pagina="datosPersonales" data-paso="3" class="min-h-screen pb-36 lg:pb-0">
  <header class="sticky top-0 z-40 border-b border-slate-200 bg-white lg:static lg:border-0 lg:bg-transparent">
    <div class="lg:border-b lg:border-slate-200 lg:bg-white">
      <div class="mx-auto flex h-14 max-w-[1360px] items-center justify-between px-3 lg:h-16 lg:px-10">
        <div class="flex items-center gap-1">
          <button type="button" class="btn size-9 p-0 text-slate-900 lg:hidden" data-variant="ghost" data-accion="volver" aria-label="Volver">
            <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <p class="text-[17px] font-semibold lg:hidden">Tus datos</p>
          <a href="catalogo.html" class="hidden items-center gap-2 lg:inline-flex" aria-label="Cubrí Seguros — inicio"><span class="inline-flex size-8 items-center justify-center rounded-lg bg-indigo-600 text-white"><svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg></span><span class="text-[17px] font-extrabold tracking-tight text-indigo-800">Cubrí</span></a>
        </div>
        <nav class="hidden items-center gap-8 lg:flex" aria-label="Menú principal">
        <a href="#" class="text-[14px] font-medium text-slate-500 hover:text-slate-900" data-sin-destino>Seguros</a>
        <a href="#" class="text-[14px] font-medium text-slate-500 hover:text-slate-900" data-sin-destino>Siniestros</a>
        <a href="#" class="text-[14px] font-medium text-slate-500 hover:text-slate-900" data-sin-destino>Ayuda</a>
        <button type="button" class="btn" data-variant="cuenta" data-sin-destino>Mi cuenta</button>
      </nav>
      </div>
    </div>
    <!-- Desktop: título de la pantalla sobre el stepper -->
    <div class="mx-auto hidden max-w-[1360px] px-10 pt-8 lg:block">
      <p class="eyebrow">Seguro de Celular</p>
      <h1 class="t-titulo">Tus datos</h1>
    </div>
    <div class="mx-auto max-w-[1360px] px-5 pb-3 lg:px-10 lg:pb-0 lg:pt-5">
      <nav id="stepper" aria-label="Progreso de la contratación" class="lg:rounded-xl lg:border lg:border-slate-200 lg:bg-white lg:px-5 lg:py-3"></nav>
    </div>
  </header>

  <main class="mx-auto max-w-[1360px] px-5 pt-5 lg:px-10 lg:pb-16 lg:pt-6">
    <div class="grid gap-6 lg:grid-cols-[1fr_380px] lg:items-start lg:gap-8">
      <form id="form-datos" class="formulario-card card" novalidate>
        <h1 class="sr-only lg:hidden">Tus datos</h1>

        <div class="grid grid-cols-2 gap-x-3 gap-y-4 lg:grid-cols-3 lg:gap-x-5 lg:gap-y-5">
        <div role="group" class="field">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" data-campo="titular.nombre" aria-describedby="nombre-error" autocomplete="given-name">
          <p id="nombre-error" role="alert" hidden></p>
        </div>
        <div role="group" class="field">
          <label for="apellido">Apellido</label>
          <input id="apellido" name="apellido" type="text" data-campo="titular.apellido" aria-describedby="apellido-error" autocomplete="family-name">
          <p id="apellido-error" role="alert" hidden></p>
        </div>
        <div role="group" class="field">
          <label for="dni">DNI</label>
          <input id="dni" name="dni" type="text" data-campo="titular.dni" aria-describedby="dni-error" inputmode="numeric" autocomplete="off">
          <p id="dni-error" role="alert" hidden></p>
        </div>
        <div role="group" class="field">
          <label for="nacimiento"><span class="lg:hidden">Nacimiento</span><span class="hidden lg:inline">Fecha de nacimiento</span></label>
          <input id="nacimiento" name="nacimiento" type="text" data-campo="titular.nacimiento" aria-describedby="nacimiento-error" placeholder="dd/mm/aaaa" autocomplete="bday">
          <p id="nacimiento-error" role="alert" hidden></p>
        </div>
        <div class="col-span-2 lg:col-span-1"><div role="group" class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" data-campo="titular.email" aria-describedby="email-error" autocomplete="email">
          <p id="email-error" role="alert" hidden></p>
        </div></div>
        <div class="col-span-2 lg:col-span-1"><div role="group" class="field">
          <label for="celular">Celular</label>
          <input id="celular" name="celular" type="tel" data-campo="titular.celular" aria-describedby="celular-error" autocomplete="tel-national">
          <p id="celular-error" role="alert" hidden></p>
        </div></div>
        </div>

        <div role="group" class="field">
          <label class="termino" for="terminos">
            <input id="terminos" name="terminos" type="checkbox" data-campo="titular.terminos" aria-describedby="terminos-error">
            <span>Acepto los términos y condiciones y la política de privacidad.</span>
          </label>
          <p id="terminos-error" role="alert" hidden></p>
        </div>

      <div class="acciones ">
        <button type="button" class="btn btn-lg hidden lg:inline-flex" data-variant="outline" data-accion="volver">Volver</button>
        <button type="submit" id="btn-continuar" class="btn btn-lg" disabled>Continuar al pago</button>
        <p id="ayuda-boton" class="acciones__ayuda"><span class="lg:hidden">El botón se habilita cuando el formulario es válido</span><span class="hidden lg:inline">Completá los campos con error para continuar</span></p>
      </div>
      </form>

      <aside id="resumen" class="card resumen-card hidden lg:block" data-variante="card" aria-label="Resumen de tu seguro"></aside>
    </div>
  </main>
</body>
</html>
